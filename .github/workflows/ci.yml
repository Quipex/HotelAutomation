name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and test backend
        run: |
          cd backend-service
          ./mvnw verify
          
  telegram-bot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: telegram-bot-service/package-lock.json
          
      - name: Install dependencies
        run: |
          cd telegram-bot-service
          npm ci
          
      - name: Lint and test
        run: |
          cd telegram-bot-service
          npm run lint
          npm test 