# Server configuration
server:
  port: 8080

# Database configuration
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hotel_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  # JPA/Hibernate configuration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: ${SHOW_SQL:false}
    properties.hibernate.format_sql: true

  # Flyway configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# EasyMS PMS Integration
easyms:
  base-url: ${EASYMS_BASE_URL:https://my.easyms.co/api}
  auth:
    login: ${EASYMS_LOGIN}
    password: ${EASYMS_PASSWORD}
    token-url: ${EASYMS_TOKEN_URL:https://my.easyms.co/oauth/token}
    token-refresh-threshold-seconds: 300
    basic-auth:
      username: ${EASYMS_BASIC_AUTH_USERNAME:easyms}
      password: ${EASYMS_BASIC_AUTH_PASSWORD:secret}
  timeouts:
    connect: 10s
    read: 30s
  retry:
    max-attempts: 3
    backoff-delay: 2s

# Notification configuration
notification:
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    admin-chat-id: ${TELEGRAM_ADMIN_CHAT_ID}
  retry:
    interval-minutes: 15
    max-retries: 3
    retry-threshold-minutes: 30

# Management & Metrics configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  prometheus:
    metrics:
      export:
        enabled: true

# Logging configuration
logging:
  level:
    root: INFO
    com.hotel: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
