# Test configuration
spring:
  datasource:
    # URL, username, password will be provided by TestContainers
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # Solve issues with PostgreSQL types
        globally_quoted_identifiers: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  # Disable security for tests
  security:
    basic:
      enabled: false

# EasyMS PMS Integration test settings
easyms:
  base-url: http://test-url
  auth:
    login: test-user
    password: test-password
  timeouts:
    connect: 1s
    read: 2s
  retry:
    max-attempts: 2
    backoff-delay: 100

# Test metrics configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

# Disable OpenAPI UI during tests
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
