# Test configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        # Решение проблем с типами PostgreSQL
        globally_quoted_identifiers: true
   flyway:
     enabled: true
     locations: classpath:db/migration/h2
     baseline-on-migrate: true

# EasyMS PMS Integration test settings
easyms:
  base-url: http://test-url
  auth:
    login: test-user
    password: test-password
  timeouts:
    connect: 1s
    read: 2s
  retry:
    max-attempts: 2
    backoff-delay: 100

# Test metrics configuration
management:
  metrics:
    export:
      prometheus:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
