# Test configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        show_sql: false
        use_sql_comments: false
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  # Disable security for tests
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/hotel
          jwk-set-uri: http://localhost:8081/realms/hotel/protocol/openid-connect/certs

# Telegram notification test settings
notification:
  telegram:
    bot:
      token: test_bot_token
      admin:
        chatId: 123456789

# EasyMS PMS Integration test settings
easymspms:
  baseUrl: http://localhost:8082/api
  username: test_user
  password: test_password

# Test metrics configuration
management:
  endpoints:
    web:
      exposure:
        include: health, info
  metrics:
    export:
      prometheus:
        enabled: false

# Disable OpenAPI UI during tests
springdoc:
  swagger-ui:
    enabled: false

# ABAC policies for testing
abac:
  policies:
    - name: admin
      description: Admin can access everything
      target: "role == 'ADMIN'"
    - name: manager
      description: Manager can manage rooms and staff
      target: "role == 'MANAGER'"
    - name: receptionist
      description: Receptionist can manage bookings
      target: "role == 'RECEPTIONIST'"
