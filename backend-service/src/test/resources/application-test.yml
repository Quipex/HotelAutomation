# Test configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        # PostgreSQL extensions support
        hbm2ddl.import_files: classpath:/sql/pg-extensions.sql
        # Solve issues with PostgreSQL types
        globally_quoted_identifiers: true
    show-sql: true
  flyway:
    enabled: false

# EasyMS PMS Integration test settings
easyms:
  base-url: http://test-url
  auth:
    login: test-user
    password: test-password
  timeouts:
    connect: 1s
    read: 2s
  retry:
    max-attempts: 2
    backoff-delay: 100

# Test metrics configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true
