# Test configuration
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        # PostgreSQL extensions support
        hbm2ddl.import_files: classpath:/sql/pg-extensions.sql
        # Solve issues with PostgreSQL types
        globally_quoted_identifiers: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
    baseline-on-migrate: true
    validate-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console

# EasyMS PMS Integration test settings
easyms:
  base-url: http://test-url
  auth:
    login: test-user
    password: test-password
  timeouts:
    connect: 1s
    read: 2s
  retry:
    max-attempts: 2
    backoff-delay: 100

# Test metrics configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  prometheus:
    metrics:
      export:
        enabled: true

# Disable OpenAPI UI during tests
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Disable security for tests
spring:
  security:
    basic:
      enabled: false
