services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hotel_v2
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_trgm.similarity_threshold=0.8"]

  backend-service:
    build:
      context: ./backend-v2
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=hotel_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    env_file:
      - backend-service/.env
    depends_on:
      postgres:
        condition: service_healthy

  telegram-bot-service:
    build:
      context: ./telegram-bot-service
    env_file:
      - telegram-bot-service/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend-service

volumes:
  pgdata:
