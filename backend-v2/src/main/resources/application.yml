spring:
  application:
    name: hotel-backend-v2
  datasource:
    url: jdbc:postgresql://localhost:5432/hotel_v2
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 8081
  servlet:
    context-path: /api/v2

logging:
  level:
    com.hotel.backendv2: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.jooq: INFO

resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      default:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  ratelimiter:
    instances:
      default:
        limitForPeriod: 10
        limitRefreshPeriod: 1s
        timeoutDuration: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

# EasyMS PMS Integration
easyms:
  base-url: ${EASYMS_BASE_URL:https://my.easyms.co/api}
  organization-id: 446
  sync:
    start-month: 5  # May
    end-month: 9    # September
  auth:
    login: ${EASYMS_LOGIN}
    password: ${EASYMS_PASSWORD}
    token-url: ${EASYMS_TOKEN_URL:https://my.easyms.co/oauth/token}
    token-refresh-threshold-seconds: 300
    basic-auth:
      username: ${EASYMS_BASIC_AUTH_USERNAME:easyms}
      password: ${EASYMS_BASIC_AUTH_PASSWORD:secret}
  timeouts:
    connect: 10s
    read: 30s
  retry:
    max-attempts: 3
    backoff-delay: 2s
