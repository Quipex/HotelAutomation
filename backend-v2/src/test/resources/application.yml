spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: 0

logging:
  level:
    com.hotel.backendv2: DEBUG
    org.springframework: INFO
    org.hibernate: INFO
    org.testcontainers: INFO
    org.flywaydb: DEBUG
    com.github.tomakehurst.wiremock: DEBUG
    org.springframework.web.client.RestTemplate: DEBUG
    org.springframework.http.client: DEBUG
    io.github.resilience4j.retry: DEBUG

easyms:
  base-url: unset
  organization-id: 446
  sync:
    start-month: 5  # May
    end-month: 9    # September
  auth:
    login: unset
    password: unset
    token-url: unset
    token-refresh-threshold-seconds: 300
    basic-auth:
      username: unset
      password: unset
  timeouts:
    connect: 10s
    read: 30s
  retry:
    max-attempts: 3
    backoff-delay: 2s

management:
  metrics:
    export:
      prometheus:
        enabled: true
